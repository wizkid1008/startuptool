const R=new Map(RUBRIC.map(e=>[e.dimension_key+":"+e.subdimension_key,e]));
const crit=(m,i)=>m*i;
const cTone=s=>s>=12?"bad":s>=8?"warn":s>=4?"info":"";
const cBand=s=>s>=12?"Critical":s>=8?"High":s>=4?"Moderate":"Low";
const mTone=s=>s<=1?"good":s===2?"info":s===3?"warn":"bad";
const iTone=s=>s>=4?"bad":s===3?"warn":s===2?"":"ghost";
const pill=(t,txt)=>`<span class="pill ${t}">${txt}</span>`;
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;

let all=[];
DIMS.forEach(d=>d.subs.forEach(([sk,m,i])=>{
  const e=R.get(d.key+":"+sk);
  all.push({dim:d,sk,m,i,c:crit(m,i),label:e?e.label:sk,entry:e});
}));
const avgC=avg(all.map(s=>s.c));
const readiness=Math.round(Math.max(0,Math.min(100,100-((avgC-1)/15)*100)));
const rTone=readiness>=70?"":readiness>=45?"warn":"bad";
const criticalCount=all.filter(s=>s.c>=12).length;

<div>${pill(cTone(avgC),cBand(avgC))}</div><div class="note">Scale 1–16 per subdimension</div></div>

<div class="stat"><div class="microlabel">Subdimensions</div><div class="num">${all.length}</div><div class="note">of 30 canonical</div></div></div>`;

const top=[...all].sort((a,b)=>b.c-a.c).slice(0,8);
h+=`<section><div class="sechead"><h2>Priority ranking</h2><span class="microlabel">Maturity × Impact · 1–16</span></div>
<div class="tablewrap"><table><thead><tr><th></th><th>Subdimension</th><th>Dimension</th><th>Maturity</th><th>Impact</th><th>Criticality</th></tr></thead><tbody>
${top.map((s,n)=>`<tr><td class="rank">${String(n+1).padStart(2,"0")}</td><td><strong>${s.label}</strong></td>
<td class="note">${s.dim.label}</td><td>${pill(mTone(s.m),s.m+" "+MATURITY_LABEL[s.m])}</td>
<td>${pill(iTone(s.i),s.i+" "+IMPACT_LABEL[s.i])}</td><td>${pill(cTone(s.c),s.c+" "+cBand(s.c))}</td></tr>`).join("")}
</tbody></table></div></section>`;

DIMS.forEach(d=>{
  const rows=all.filter(s=>s.dim.key===d.key);
  const sm=avg(rows.map(r=>r.m)),si=avg(rows.map(r=>r.i)),sc=Math.round(avg(rows.map(r=>r.c)));
  h+=`<section><div class="sechead"><h2>${d.label}</h2><span class="microlabel">Segment · maturity ${sm.toFixed(1)} · impact ${si.toFixed(1)} · criticality ${sc}</span></div>
  <div class="tablewrap">
  <div style="display:grid;grid-template-columns:1fr 150px 150px 120px 20px;gap:12px;padding:11px 14px;background:var(--paper);border-bottom:1px solid var(--line)">
  <span class="microlabel">Subdimension</span><span class="microlabel hidesm">Maturity</span><span class="microlabel hidesm">Impact</span><span class="microlabel">Criticality</span><span></span></div>`;
  rows.forEach(s=>{
    const lv=s.entry?s.entry.levels:[];
    h+=`<details><summary><span><strong>${s.label}</strong></span>
    <span class="hidesm">${pill(mTone(s.m),s.m+" "+MATURITY_LABEL[s.m])}</span>
    <span class="hidesm">${pill(iTone(s.i),s.i+" "+IMPACT_LABEL[s.i])}</span>
    <span>${pill(cTone(s.c),s.c+" "+cBand(s.c))}</span><span class="chev">▶</span></summary>
    <div class="expand"><div class="microlabel">Maturity rubric — what each rating means</div>
    <div class="levels">${[1,2,3,4].map(l=>{
      const e=lv.find(z=>z.level===l);
      return `<div class="lvl ${l===s.m?"sel":""}"><div class="lvlhead"><span class="lvlnum">Level ${l} · ${MATURITY_LABEL[l]}</span>${l===s.m?pill("","Selected"):""}</div>
      <ul>${e&&e.bullets.length?e.bullets.map(b=>`<li>${b}</li>`).join(""):"<li>—</li>"}</ul></div>`;
    }).join("")}</div>
    <div class="impactbox"><strong>Impact ${s.i} — ${IMPACT_LABEL[s.i]}.</strong> ${IMPACT_DEF[s.i]}<br>
    <span class="note">Criticality = maturity ${s.m} × impact ${s.i} = <strong>${s.c}</strong> (${cBand(s.c)})</span></div>
    </div></details>`;
  });
  h+=`</div></section>`;
});
document.getElementById("app").innerHTML=h;
</script></body></html>
