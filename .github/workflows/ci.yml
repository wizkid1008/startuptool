name: CI

# Scoped to the SMEAT branch on purpose. `main` is an unrelated static site
# with a different package.json and no typecheck script, so running this there
# would only produce noise.
on:
  push:
    branches: ["codex/smeat-nextjs-supabase-rebuild"]
  pull_request:
    branches: ["codex/smeat-nextjs-supabase-rebuild"]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, build, lint
    runs-on: ubuntu-latest

    env:
      # Placeholders only. Every page is force-dynamic, so nothing is
      # prerendered and no real credentials are needed to compile. These exist
      # so the build fails on genuine type or lint errors rather than on
      # missing configuration.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      ANTHROPIC_API_KEY: placeholder-anthropic-key

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # `npm ci` and setup-node's npm cache both require a lockfile, and this
      # repo has none. Worth committing a package-lock.json later so CI builds
      # are reproducible.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Build runs before lint deliberately: build is the gate that tells us
      # whether the app is deployable, lint is style. Ordering it first means a
      # lint failure still leaves us knowing the build's status.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
