name: CI

# Scoped to the SMEAT branch on purpose. `main` is an unrelated static site
# with a different package.json and no typecheck script, so running this there
# would only produce noise.
on:
  push:
    branches: ["codex/smeat-nextjs-supabase-rebuild"]
  pull_request:
    branches: ["codex/smeat-nextjs-supabase-rebuild"]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, build, lint
    runs-on: ubuntu-latest

    env:
      # Placeholders only. Every page is force-dynamic, so nothing is
      # prerendered and no real credentials are needed to compile. These exist
      # so the build fails on genuine type or lint errors rather than on
      # missing configuration.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      ANTHROPIC_API_KEY: placeholder-anthropic-key

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # `npm ci` and setup-node's npm cache both require a lockfile, and this
      # repo has none. Worth committing a package-lock.json later so CI builds
      # are reproducible.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        id: typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log

      # Build runs before lint deliberately: build is the gate that tells us
      # whether the app is deployable, lint is style.
      - name: Build
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Lint
        id: lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.log

      # Step logs need authentication to read, but annotations are public.
      # Echo the tail of whichever step failed into an annotation so failures
      # are diagnosable from the API without a token.
      - name: Surface failure output
        if: failure()
        run: |
          escape() {
            tail -c 4000 "$1" \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'
          }
          for step in typecheck build lint; do
            log="/tmp/${step}.log"
            if [ -f "$log" ]; then
              echo "::error title=${step} output::$(escape "$log")"
            fi
          done
